<style>
:root{
  --blue:#1c6fb8;
  --blue-dark:#114f87;
  --red:#dd3024;
  --red-dark:#b4241a;
  --bg:#f3f5f8;
  --card:#ffffff;
  --ink:#1b2430;
  --ink-soft:#5b6673;
  --border:#e1e6ec;
  --ok:#1e8e3e;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:env(safe-area-inset-top);
}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* Header */
header.topbar{
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  color:#fff;
  padding:18px 20px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header.topbar .back{
  background:rgba(255,255,255,.18);
  border:none;color:#fff;border-radius:10px;
  width:38px;height:38px;font-size:20px;line-height:1;cursor:pointer;
  display:none;align-items:center;justify-content:center;flex-shrink:0;
}
header.topbar .back.show{display:flex;}
header.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
header.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;}
header.topbar h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
header.topbar .sub{font-size:12px;opacity:.85;margin-top:2px;}

main{flex:1;padding:16px 16px 100px;}

/* Home screen cards */
.home-intro{padding:4px 2px 18px;}
.home-intro h2{font-size:20px;margin:0 0 4px;}
.home-intro p{margin:0;color:var(--ink-soft);font-size:14px;}

.form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.form-card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  box-shadow:0 1px 3px rgba(16,24,40,.05);
  transition:transform .12s ease, box-shadow .12s ease;
}
.form-card:active{transform:scale(.98);}
.form-card .icon{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.form-card .icon.red{background:var(--red);}
.form-card .meta{flex:1;min-width:0;}
.form-card .meta .t{font-weight:700;font-size:15.5px;}
.form-card .meta .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.form-card .chev{color:var(--ink-soft);font-size:18px;}

/* Queue banner */
.queue-banner{
  background:#fff7e6;border:1px solid #ffdf99;color:#8a5a00;
  border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.queue-banner button{
  margin-left:auto;background:#fff;border:1px solid #ffdf99;border-radius:8px;
  padding:5px 10px;font-size:12px;color:#8a5a00;cursor:pointer;
}

/* Form rendering */
.field{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  padding:14px 16px;margin-bottom:12px;
}
.field label.flabel{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px;line-height:1.35;}
.field label.flabel .req{color:var(--red);margin-left:3px;}
.field input[type=text],
.field input[type=date],
.field textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:15px;font-family:inherit;background:#fbfcfe;
  color:var(--ink);
}
.field textarea{min-height:84px;resize:vertical;}
.field input:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:1px;background:#fff;}

.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{
  flex:1;min-width:80px;text-align:center;
  border:1.5px solid var(--border);border-radius:10px;padding:10px 8px;
  font-size:14px;font-weight:600;color:var(--ink-soft);background:#fbfcfe;cursor:pointer;
  user-select:none;
}
.opt-btn.selected{border-color:var(--blue);background:var(--blue);color:#fff;}
.opt-btn.selected.opt-non{border-color:var(--red);background:var(--red);}

.grid-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin-bottom:12px;}
.grid-section > .gtitle{font-weight:700;font-size:15px;margin-bottom:10px;}
.grid-row{padding:10px 0;border-top:1px solid var(--border);}
.grid-row:first-of-type{border-top:none;}
.grid-row .glabel{font-size:13.5px;color:var(--ink);margin-bottom:7px;}
.grid-row .opt-row .opt-btn{padding:8px 6px;font-size:13px;min-width:0;}

/* Photo field */
.photo-field{display:flex;flex-direction:column;gap:10px;}
.photo-preview{
  width:100%;max-height:220px;border-radius:10px;overflow:hidden;
  display:none;background:#eef1f5;
}
.photo-preview img{width:100%;display:block;object-fit:cover;}
.photo-buttons{display:flex;gap:10px;}
.photo-btn{
  flex:1;border:1.5px dashed var(--blue);border-radius:10px;background:#f2f7fc;
  color:var(--blue);font-weight:600;font-size:13.5px;padding:12px 8px;cursor:pointer;
  text-align:center;
}
.photo-status{font-size:12.5px;color:var(--ink-soft);}
.photo-status.ok{color:var(--ok);}
.photo-status.err{color:var(--red);}

/* Submit bar */
.submit-bar{
  position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,245,248,0),var(--bg) 25%);
  padding:14px 0 10px;margin-top:6px;
}
.btn-submit{
  width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;
  padding:15px;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(28,111,184,.35);
}
.btn-submit:active{transform:scale(.99);}
.btn-submit:disabled{opacity:.6;}
.error-summary{
  background:#fdeceb;border:1px solid #f6c1bc;color:var(--red-dark);
  border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;display:none;
}

/* Success screen */
.success-screen{text-align:center;padding:60px 20px;}
.success-screen .check{
  width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px;
}
.success-screen h2{margin:0 0 8px;font-size:20px;}
.success-screen p{color:var(--ink-soft);margin:0 0 24px;font-size:14px;}
.success-screen.queued .check{background:#e59500;}
.btn-secondary{
  background:#fff;border:1.5px solid var(--border);color:var(--ink);
  border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:600;cursor:pointer;
}

.hidden{display:none !important;}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#1b2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;
  z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;}
</style>
</head>

  <main id="main"></main>
</div>

const PHOTO_ENDPOINT = "https://script.google.com/macros/s/AKfycbwD_7m32ZzNBKB3eQJsu5cqJYw7P0kMu1uTKSdM602MPDNEjsLfPempu4J03dXAWtHmmg/exec";
const QUEUE_KEY = "aetsi_pending_submissions_v1";

const ICONS = {
  chantier: "&#127959;",
  alerte: "&#9888;",
  briefing: "&#128221;",
  vehicule: "&#128666;"
};

let state = {
  screen: "home",
  values: {},
  photo: { status: "idle", url: null, base64: null, filename: null }
};

const mainEl = document.getElementById("main");
const backBtn = document.getElementById("backBtn");
const headerTitle = document.getElementById("headerTitle");
const headerSub = document.getElementById("headerSub");

backBtn.addEventListener("click", () => {
  if (state.screen !== "home") {
    goHome();
  }
});

function toast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
}

function goHome() {
  state.screen = "home";
  state.values = {};
  state.photo = { status: "idle", url: null, base64: null, filename: null };
  backBtn.classList.remove("show");
  headerTitle.textContent = "AETSI Terrain";
  headerSub.textContent = "Saisie sécurité & qualité";
  renderHome();
}

function openForm(formId) {
  const form = FORMS.find(f => f.id === formId);
  if (!form) return;
  state.screen = formId;
  state.values = {};
  state.photo = { status: "idle", url: null, base64: null, filename: null };
  backBtn.classList.add("show");
  headerTitle.textContent = form.title;
  headerSub.textContent = form.subtitle || "AETSI";
  renderForm(form);
}

function renderHome() {
  const pending = getQueue();
  let html = "";
  if (pending.length > 0) {
    html += `<div class="queue-banner">
      <span>&#9203; ${pending.length} envoi(s) en attente de connexion</span>
      <button id="retryQueueBtn">Réessayer</button>
    </div>`;
  }
  html += `<div class="home-intro">
    <h2>Formulaires AETSI</h2>
    <p>Sélectionnez un formulaire à remplir sur le terrain.</p>
  </div>
  <div class="form-grid">`;
  FORMS.forEach((f, i) => {
    const iconHtml = ICONS[f.icon] || "&#128196;";
    const iconClass = (f.id === "situation_dangereuse") ? "icon red" : "icon";
    html += `<div class="form-card" data-form="${f.id}">
      <div class="${iconClass}">${iconHtml}</div>
      <div class="meta">
        <div class="t">${esc(f.title)}</div>
        <div class="s">${esc(f.subtitle || "Formulaire AETSI")}</div>
      </div>
      <div class="chev">&#8250;</div>
    </div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;

  mainEl.querySelectorAll(".form-card").forEach(card => {
    card.addEventListener("click", () => openForm(card.dataset.form));
  });
  const retryBtn = document.getElementById("retryQueueBtn");
  if (retryBtn) retryBtn.addEventListener("click", flushQueue);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderForm(form) {
  let html = `<div class="error-summary" id="errorSummary"></div>`;
  form.fields.forEach((field, idx) => {
    html += renderField(field, idx);
  });
  html += `<div class="submit-bar"><button class="btn-submit" id="submitBtn">Envoyer le formulaire</button></div>`;
  mainEl.innerHTML = html;

  mainEl.querySelectorAll(".opt-btn").forEach(btn => {
    btn.addEventListener("click", () => handleOptionClick(btn));
  });

  const photoInput = mainEl.querySelector("#photoInput");
  if (photoInput) {
    photoInput.addEventListener("change", handlePhotoSelected);
  }

  document.getElementById("submitBtn").addEventListener("click", () => submitForm(form));
}

function renderField(field, idx) {
  if (field.type === "text") {
    return `<div class="field">
      <label class="flabel">${esc(field.label)}${field.required ? '<span class="req">*</span>' : ""}</label>
      <input type="text" data-entry="${field.entry}" data-type="text" autocomplete="off">
    </div>`;
  }
  if (field.type === "textarea") {
    const targetAttr = field.photoTarget ? 'data-photo-target="1"' : "";
    return `<div class="field">
      <label class="flabel">${esc(field.label)}${field.required ? '<span class="req">*</span>' : ""}</label>
      <textarea data-entry="${field.entry}" data-type="textarea" ${targetAttr}></textarea>
    </div>`;
  }
  if (field.type === "date") {
    return `<div class="field">
      <label class="flabel">${esc(field.label)}${field.required ? '<span class="req">*</span>' : ""}</label>
      <input type="date" data-entry="${field.entry}" data-type="date">
    </div>`;
  }
  if (field.type === "radio" || field.type === "checkbox") {
    let opts = "";
    field.options.forEach(o => {
      const cls = (o.toLowerCase() === "non") ? "opt-btn opt-non" : "opt-btn";
      opts += `<div class="${cls}" data-entry="${field.entry}" data-value="${esc(o)}" data-mode="${field.type}">${esc(o)}</div>`;
    });
    return `<div class="field">
      <label class="flabel">${esc(field.label)}${field.required ? '<span class="req">*</span>' : ""}</label>
      <div class="opt-row">${opts}</div>
    </div>`;
  }
  if (field.type === "grid") {
    let rows = "";
    field.rows.forEach(row => {
      let opts = "";
      field.options.forEach(o => {
        const cls = (o.toLowerCase() === "non") ? "opt-btn opt-non" : "opt-btn";
        opts += `<div class="${cls}" data-entry="${row.entry}" data-value="${esc(o)}" data-mode="radio">${esc(o)}</div>`;
      });
      rows += `<div class="grid-row">
        <div class="glabel">${esc(row.label)}${field.required ? '<span class="req">*</span>' : ""}</div>
        <div class="opt-row">${opts}</div>
      </div>`;
    });
    return `<div class="grid-section">
      <div class="gtitle">${esc(field.title)}</div>
      ${rows}
    </div>`;
  }
  if (field.type === "photo") {
    return `<div class="field photo-field">
      <label class="flabel">${esc(field.label)} <span style="font-weight:400;color:var(--ink-soft);">(optionnel)</span></label>
      <div class="photo-preview" id="photoPreview"><img id="photoImg" alt="Aperçu photo"></div>
      <div class="photo-buttons">
        <button type="button" class="photo-btn" id="photoTakeBtn">&#128247; Prendre / choisir une photo</button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
      <div class="photo-status" id="photoStatus"></div>
    </div>`;
  }
  return "";
}

function handleOptionClick(btn) {
  const entry = btn.dataset.entry;
  const mode = btn.dataset.mode;
  const value = btn.dataset.value;
  const group = mainEl.querySelectorAll(`.opt-btn[data-entry="${entry}"]`);

  if (mode === "checkbox") {
    const nowSelected = !btn.classList.contains("selected");
    btn.classList.toggle("selected", nowSelected);
    if (!state.values[entry]) state.values[entry] = new Set();
    if (nowSelected) state.values[entry].add(value); else state.values[entry].delete(value);
  } else {
    group.forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    state.values[entry] = value;
  }
}

function wirePhotoButton() {
  const takeBtn = document.getElementById("photoTakeBtn");
  const input = document.getElementById("photoInput");
  if (takeBtn && input) {
    takeBtn.addEventListener("click", () => input.click());
  }
}

function handlePhotoSelected(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById("photoStatus");
  const reader = new FileReader();
  reader.onload = async function () {
    const base64 = reader.result;
    state.photo.base64 = base64;
    state.photo.filename = file.name || ("photo_" + Date.now() + ".jpg");
    state.photo.status = "ready";

    const preview = document.getElementById("photoPreview");
    const img = document.getElementById("photoImg");
    img.src = base64;
    preview.style.display = "block";

    statusEl.textContent = "Envoi de la photo en cours...";
    statusEl.className = "photo-status";
    state.photo.status = "uploading";

    try {
      const resp = await fetch(PHOTO_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          photoBase64: base64,
          filename: state.photo.filename,
          label: "Photo situation dangereuse - AETSI Terrain"
        })
      });
      const data = await resp.json();
      if (data && data.success) {
        state.photo.url = data.url;
        state.photo.status = "uploaded";
        statusEl.textContent = "Photo envoyée ✓";
        statusEl.className = "photo-status ok";
      } else {
        throw new Error((data && data.error) || "Erreur inconnue");
      }
    } catch (err) {
      state.photo.status = "error";
      statusEl.textContent = "Échec de l'envoi de la photo (" + (err.message || err) + "). La photo ne sera pas jointe mais vous pouvez continuer.";
      statusEl.className = "photo-status err";
    }
  };
  reader.readAsDataURL(file);
}

function collectAndValidate(form) {
  const missing = [];
  const params = new URLSearchParams();

  form.fields.forEach(field => {
    if (field.type === "text" || field.type === "textarea") {
      const el = mainEl.querySelector(`[data-entry="${field.entry}"]`);
      let val = el ? el.value.trim() : "";
      if (field.photoTarget && state.photo.status === "uploaded" && state.photo.url) {
        val = (val ? val + "\n\n" : "") + "Photo : " + state.photo.url;
      }
      if (field.required && !val) missing.push(field.label);
      if (val) params.append("entry." + field.entry, val);
    } else if (field.type === "date") {
      const el = mainEl.querySelector(`[data-entry="${field.entry}"]`);
      const val = el ? el.value : "";
      if (field.required && !val) missing.push(field.label);
      if (val) {
        const [y, m, d] = val.split("-");
        params.append("entry." + field.entry + "_year", y);
        params.append("entry." + field.entry + "_month", String(parseInt(m, 10)));
        params.append("entry." + field.entry + "_day", String(parseInt(d, 10)));
      }
    } else if (field.type === "radio") {
      const val = state.values[field.entry];
      if (field.required && !val) missing.push(field.label);
      if (val) params.append("entry." + field.entry, val);
    } else if (field.type === "checkbox") {
      const set = state.values[field.entry];
      const vals = set ? Array.from(set) : [];
      if (field.required && vals.length === 0) missing.push(field.label);
      vals.forEach(v => params.append("entry." + field.entry, v));
    } else if (field.type === "grid") {
      field.rows.forEach(row => {
        const val = state.values[row.entry];
        if (field.required && !val) missing.push(field.title + " – " + row.label);
        if (val) params.append("entry." + row.entry, val);
      });
    }
  });

  return { missing, params };
}

function submitForm(form) {
  const { missing, params } = collectAndValidate(form);
  const errEl = document.getElementById("errorSummary");

  if (missing.length > 0) {
    errEl.style.display = "block";
    errEl.innerHTML = "Veuillez compléter : <br>• " + missing.map(esc).join("<br>• ");
    errEl.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  errEl.style.display = "none";

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Envoi en cours...";

  const url = "https://docs.google.com/forms/d/e/" + form.actionId + "/formResponse";
  const body = params.toString();

  if (!navigator.onLine) {
    queueSubmission(url, body);
    showSuccess(form, true);
    return;
  }

  fetch(url, { method: "POST", mode: "no-cors", body: params })
    .then(() => {
      showSuccess(form, false);
    })
    .catch(() => {
      queueSubmission(url, body);
      showSuccess(form, true);
    });
}

function showSuccess(form, queued) {
  const cls = queued ? "success-screen queued" : "success-screen";
  const icon = queued ? "&#9203;" : "&#10003;";
  const title = queued ? "Mis en attente" : "Envoyé";
  const msg = queued
    ? "Pas de connexion internet détectée. Le formulaire sera envoyé automatiquement dès que la connexion sera rétablie."
    : "Le formulaire \"" + esc(form.title) + "\" a bien été transmis.";
  mainEl.innerHTML = `<div class="${cls}">
    <div class="check">${icon}</div>
    <h2>${title}</h2>
    <p>${msg}</p>
    <button class="btn-secondary" id="backHomeBtn">Retour à l'accueil</button>
  </div>`;
  document.getElementById("backHomeBtn").addEventListener("click", goHome);
}

function getQueue() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}
function setQueue(q) {
  try {
    localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  } catch (e) {}
}
function queueSubmission(url, body) {
  const q = getQueue();
  q.push({ url, body, ts: Date.now() });
  setQueue(q);
}
function flushQueue() {
  const q = getQueue();
  if (q.length === 0) {
    toast("Aucun envoi en attente");
    return;
  }
  if (!navigator.onLine) {
    toast("Toujours hors connexion");
    return;
  }
  toast("Envoi de " + q.length + " formulaire(s) en attente...");
  const remaining = [];
  let processed = 0;
  q.forEach(item => {
    fetch(item.url, { method: "POST", mode: "no-cors", body: item.body })
      .catch(() => { remaining.push(item); })
      .finally(() => {
        processed++;
        if (processed === q.length) {
          setQueue(remaining);
          if (remaining.length === 0) {
            toast("Tous les formulaires en attente ont été envoyés ✓");
          } else {
            toast(remaining.length + " envoi(s) ont échoué, nouvelle tentative plus tard");
          }
          if (state.screen === "home") renderHome();
        }
      });
  });
}
window.addEventListener("online", () => {
  toast("Connexion rétablie");
  flushQueue();
});

const _origRenderForm = renderForm;
renderForm = function (form) {
  _origRenderForm(form);
  wirePhotoButton();
};

goHome();
</script>
</body>
</html>
